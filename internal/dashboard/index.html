<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Dashboard do Limiar Collector">
    <title>Limiar Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      *:focus-visible { outline: 2px solid var(--accent, #6366f1); }
    </style>
  </head>
  <body class="bg-[#0a0a0a] text-[#fafafa] font-sans antialiased overflow-hidden" x-data="dashboard" x-effect="document.title = $store.global.processedStats ? '(' + $store.global.processedStats.total + ') Limiar Dashboard' : 'Limiar Dashboard'">
    <div id="app" class="flex h-screen w-screen overflow-hidden bg-[#0a0a0a] text-[#fafafa] font-sans border border-[#262626]">
      <!-- Left Sidebar -->
      <aside class="w-64 flex flex-col border-r border-[#262626] bg-[#0a0a0a] flex-shrink-0">
        <div class="p-4 flex items-center gap-2 border-b border-[#262626]">
          <div class="flex gap-1.5 mr-2">
            <div class="w-3 h-3 rounded-full bg-[#ef4444]"></div>
            <div class="w-3 h-3 rounded-full bg-[#f59e0b]"></div>
            <div class="w-3 h-3 rounded-full bg-[#22c55e]"></div>
          </div>
          <h1 class="text-sm font-bold tracking-tight uppercase text-[#fafafa]">Limiar</h1>
        </div>
        <nav class="flex-1 px-3 py-4 space-y-1 flex flex-col min-h-0">
          <div class="text-[10px] uppercase tracking-widest text-[#737373] font-bold px-2 mb-2">Navegação</div>
          <button @click="activeTab = 'processed'" :class="{'bg-[#1a1a1a] text-[#fafafa] border border-[#262626]': activeTab === 'processed', 'text-[#737373] hover:bg-[#111111] transition-colors border border-transparent': activeTab !== 'processed'}" class="w-full flex items-center gap-3 px-3 py-2 text-sm rounded-[6px]">
            <i data-lucide="layout-grid" class="w-4 h-4" :class="{'text-[#6366f1]': activeTab === 'processed'}"></i> Processed Deals
          </button>
          <button @click="activeTab = 'raw'" :class="{'bg-[#1a1a1a] text-[#fafafa] border border-[#262626]': activeTab === 'raw', 'text-[#737373] hover:bg-[#111111] transition-colors border border-transparent': activeTab !== 'raw'}" class="w-full flex items-center gap-3 px-3 py-2 text-sm rounded-[6px]">
            <i data-lucide="code" class="w-4 h-4" :class="{'text-[#6366f1]': activeTab === 'raw'}"></i> Raw Messages
          </button>
          <div class="pt-6 flex-1 flex flex-col min-h-0">
            <div class="text-[10px] uppercase tracking-widest text-[#737373] font-bold px-2 mb-2 flex-shrink-0">Canais Ativos</div>
            <div class="space-y-1 overflow-y-auto flex-1">
              <template x-for="c in $store.global.channels" :key="c.ChannelID">
                <div class="flex items-center justify-between px-3 py-1.5 text-xs text-[#fafafa]">
                  <span :title="c.Username || 'id:' + c.ChannelID" x-text="c.Username || 'id:' + c.ChannelID" class="truncate"></span>
                  <span class="font-mono text-[#737373]" x-text="c.MessageCount > 1000 ? (c.MessageCount/1000).toFixed(1) + 'k' : c.MessageCount"></span>
                </div>
              </template>
              <div x-show="$store.global.channels.length === 0" class="px-3 py-4 text-xs text-[#737373] text-center border border-dashed border-[#262626] rounded-[6px] mx-2">
                <p class="mb-2">Nenhum canal monitorado.</p>
                <code class="text-[10px] bg-[#111111] px-1 py-0.5 rounded text-[#fafafa]">limiar-collector channels add</code>
              </div>
            </div>
          </div>
        </nav>
        <div class="p-4 border-t border-[#262626]" x-data="{ status: () => $store.global.connectionStatus }">
          <div class="flex items-center gap-2 mb-3">
            <div class="w-2 h-2 rounded-full" :class="{'bg-[#22c55e]': status() === 'connected', 'bg-[#f59e0b]': status() === 'polling', 'bg-[#ef4444]': status() === 'disconnected'}"></div>
            <span class="text-[11px] font-medium text-[#737373]" x-text="status() === 'connected' ? 'CONEXÃO LIVE (SSE)' : (status() === 'polling' ? 'POLLING (30S)' : 'OFFLINE')"></span>
          </div>
          <div class="text-[10px] text-[#737373] font-mono uppercase">v1.2.4-stable</div>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="flex-1 flex flex-col min-w-0 bg-[#0a0a0a]">
        
        <!-- Stats Row -->
        <header class="p-4 border-b border-[#262626] grid grid-cols-2 md:grid-cols-5 gap-4" x-data="{ h: () => $store.global.health, s: () => $store.global.processedStats }">
          <div class="bg-[#111111] border border-[#262626] p-3 rounded-[6px]">
            <div class="text-[10px] text-[#737373] uppercase font-bold mb-1">Canais</div>
            <div class="text-xl font-bold" x-text="$store.global.channels.length || '-'"></div>
          </div>
          <div class="bg-[#111111] border border-[#262626] p-3 rounded-[6px]">
            <div class="text-[10px] text-[#737373] uppercase font-bold mb-1">Msgs Raw</div>
            <div class="text-xl font-bold" x-text="h() ? h().raw_messages.toLocaleString('pt-BR') : '-'"></div>
          </div>
          <div class="bg-[#111111] border border-[#262626] p-3 rounded-[6px]">
            <div class="text-[10px] text-[#737373] uppercase font-bold mb-1">Processadas</div>
            <div class="text-xl font-bold" x-text="s() ? s().total.toLocaleString('pt-BR') : '-'"></div>
          </div>
          <div class="bg-[#111111] border border-[#262626] p-3 rounded-[6px]">
            <div class="text-[10px] text-[#737373] uppercase font-bold mb-1">Status DB</div>
            <div class="text-xl font-bold text-[#22c55e]" :class="h() && h().db ? 'text-[#22c55e]' : 'text-[#ef4444]'" x-text="h() && h().db ? 'OK' : 'ERR'"></div>
          </div>
          <div class="bg-[#111111] border border-[#262626] p-3 rounded-[6px]">
            <div class="text-[10px] text-[#737373] uppercase font-bold mb-1">Uptime</div>
            <div class="text-xl font-bold font-mono" x-text="h() ? Math.floor(h().uptime_seconds / 3600) + 'h ' + Math.floor((h().uptime_seconds % 3600)/60) + 'm' : '-'"></div>
          </div>
        </header>

        <div class="flex-1 flex flex-col min-h-0">
          
          <!-- Raw Tab -->
          <div x-show="activeTab === 'raw'" x-data="rawTab" style="display: none;" class="flex-1 flex flex-col min-h-0">
            <div class="flex items-center gap-4 p-4 border-b border-[#262626] bg-[#0d0d0d] flex-shrink-0">
              <div class="flex-1 relative">
                <input type="text" x-model="search" placeholder="Buscar no payload..." class="w-full bg-[#111111] border border-[#262626] text-sm py-1.5 pl-9 pr-4 rounded-[4px] focus:outline-none focus:border-[#6366f1] transition-colors text-[#fafafa] placeholder-[#737373]">
                <i data-lucide="search" class="w-4 h-4 absolute left-3 top-2 text-[#737373]"></i>
              </div>
              <select x-model="channelId" class="bg-[#111111] border border-[#262626] text-xs py-1.5 px-3 rounded-[4px] text-[#fafafa] focus:outline-none focus:border-[#6366f1]">
                <option value="">Todos os canais</option>
                <template x-for="c in $store.global.channels" :key="c.ChannelID">
                  <option :value="c.ChannelID" x-text="c.Username || 'id:' + c.ChannelID"></option>
                </template>
              </select>
            </div>

            <div class="flex-1 overflow-hidden flex">
              <div class="flex-1 divide-y divide-[#262626] overflow-y-auto" role="log" aria-live="polite" aria-label="Lista de mensagens raw">
                <div x-show="loading" class="p-4 space-y-3">
                  <template x-for="i in 5">
                    <div class="h-20 bg-[#111111] border border-[#262626] rounded-[4px] animate-pulse"></div>
                  </template>
                </div>
                <div x-show="!loading && messages.length === 0" class="flex flex-col items-center justify-center py-24 text-[#737373]">
                  <i data-lucide="inbox" class="w-12 h-12 mb-4 opacity-50"></i>
                  <p class="text-sm">Nenhuma mensagem encontrada.</p>
                </div>
                <template x-for="msg in messages" :key="msg.ID">
                  <div role="button" tabindex="0" @click="$store.global.openDetail(msg, 'raw')" @keydown.enter="$store.global.openDetail(msg, 'raw')" @keydown.space.prevent="$store.global.openDetail(msg, 'raw')" class="p-3 flex gap-4 cursor-pointer transition-colors" :class="$store.global.detailMessage?.ID === msg.ID && $store.global.detailType === 'raw' ? 'bg-[#1a1a1a] border-l-2 border-l-[#6366f1]' : 'hover:bg-[#111111] border-l-2 border-l-transparent'">
                     <div class="w-12 h-12 bg-[#262626] rounded-[4px] flex-shrink-0 flex items-center justify-center">
                       <i data-lucide="file-json" class="w-5 h-5 text-[#737373]"></i>
                     </div>
                     <div class="flex-1 min-w-0 flex flex-col justify-center">
                        <div class="flex items-center gap-2 mb-1">
                          <span class="px-1.5 py-0.5 rounded text-[9px] font-bold uppercase tracking-wider bg-[#111111] text-[#fafafa] border border-[#262626]" x-text="'#' + msg.ID"></span>
                          <span class="text-[10px] text-[#737373] font-mono" x-text="'CH ' + msg.ChannelID + ' • ' + formatDate(msg.ReceivedAt)"></span>
                        </div>
                        <p class="text-sm font-mono truncate text-[#fafafa]" x-text="getPreview(msg.Payload)"></p>
                     </div>
                  </div>
                </template>
              </div>
            </div>
          </div>

          <!-- Processed Tab -->
          <div x-show="activeTab === 'processed'" x-data="processedTab" style="display: none;" class="flex-1 flex flex-col min-h-0">
            <div class="flex items-center gap-4 p-4 border-b border-[#262626] bg-[#0d0d0d] flex-shrink-0">
              <div class="flex-1 relative">
                <input type="text" x-model="search" placeholder="Buscar em text_clean..." class="w-full bg-[#111111] border border-[#262626] text-sm py-1.5 pl-9 pr-4 rounded-[4px] focus:outline-none focus:border-[#6366f1] transition-colors text-[#fafafa] placeholder-[#737373]">
                <i data-lucide="search" class="w-4 h-4 absolute left-3 top-2 text-[#737373]"></i>
              </div>
              <select x-model="typeFilter" class="bg-[#111111] border border-[#262626] text-xs py-1.5 px-3 rounded-[4px] text-[#fafafa] focus:outline-none focus:border-[#6366f1]">
                <option value="">Todos os Tipos</option>
                <option value="deal_complete">deal_complete</option>
                <option value="deal_no_coupon">deal_no_coupon</option>
                <option value="deal_no_price">deal_no_price</option>
                <option value="coupon_only">coupon_only</option>
                <option value="commentary">commentary</option>
              </select>
              <select x-model="merchantFilter" class="bg-[#111111] border border-[#262626] text-xs py-1.5 px-3 rounded-[4px] text-[#fafafa] focus:outline-none focus:border-[#6366f1]">
                <option value="">Lojas</option>
                <option value="amazon">Amazon</option>
                <option value="mercadolivre">Mercado Livre</option>
                <option value="shopee">Shopee</option>
                <option value="aliexpress">AliExpress</option>
                <option value="magalu">Magalu</option>
              </select>
            </div>

            <div class="flex-1 overflow-hidden flex">
              <div class="flex-1 divide-y divide-[#262626] overflow-y-auto" role="log" aria-live="polite" aria-label="Lista de deals processados">
                <div x-show="loading" class="p-4 space-y-3">
                  <template x-for="i in 5">
                    <div class="h-32 bg-[#111111] border border-[#262626] rounded-[4px] animate-pulse"></div>
                  </template>
                </div>
                <div x-show="!loading && messages.length === 0" class="flex flex-col items-center justify-center py-24 text-[#737373]">
                  <i data-lucide="search-x" class="w-12 h-12 mb-4 opacity-50"></i>
                  <p class="text-sm">Nenhum deal encontrado com esses filtros.</p>
                </div>
                
                <template x-for="msg in messages" :key="msg.id">
                  <div role="button" tabindex="0" @click="$store.global.openDetail(msg, 'processed')" @keydown.enter="$store.global.openDetail(msg, 'processed')" @keydown.space.prevent="$store.global.openDetail(msg, 'processed')" class="p-3 flex gap-4 cursor-pointer transition-colors" :class="$store.global.detailMessage?.id === msg.id && $store.global.detailType === 'processed' ? 'bg-[#1a1a1a] border-l-2 border-l-[#6366f1]' : 'hover:bg-[#111111] border-l-2 border-l-transparent'">
                    <div class="w-24 h-24 bg-[#262626] rounded-[4px] flex-shrink-0 relative overflow-hidden flex items-center justify-center">
                      <template x-if="msg.photo_id > 0">
                        <img :src="getMediaUrl(msg.id)" @error="$event.target.style.display='none'" class="absolute inset-0 w-full h-full object-cover" loading="lazy" />
                      </template>
                      <template x-if="msg.photo_id === 0">
                        <span class="text-[#737373] text-[10px]">NO PHOTO</span>
                      </template>
                    </div>
                    <div class="flex-1 min-w-0 flex flex-col justify-between">
                      <div class="flex items-start justify-between">
                        <div>
                          <div class="flex items-center gap-2 mb-1">
                            <span class="px-1.5 py-0.5 rounded text-[9px] font-bold uppercase tracking-wider border" :class="getBadgeColor(msg.message_type)" x-text="msg.message_type"></span>
                            <span class="text-[10px] text-[#737373] font-mono truncate" x-text="formatDate(msg.posted_at)"></span>
                          </div>
                          <h3 class="text-sm font-semibold truncate text-[#fafafa]" x-text="msg.product_name || msg.text_clean.split('\n')[0]"></h3>
                        </div>
                        <div class="text-right ml-2 flex-shrink-0">
                          <template x-if="msg.has_price && msg.price_amount > 0">
                            <div>
                              <div x-show="msg.price_original > msg.price_amount" class="text-xs text-[#737373] line-through" x-text="formatPrice(msg.price_original)"></div>
                              <div class="text-lg font-bold text-[#fafafa]" x-text="formatPrice(msg.price_amount)"></div>
                            </div>
                          </template>
                          <template x-if="!msg.has_price || msg.price_amount === 0">
                            <div class="text-xs text-[#737373] italic font-mono mt-1">PRICE NOT FOUND</div>
                          </template>
                        </div>
                      </div>
                      <div class="flex items-center justify-between mt-2">
                        <div class="flex gap-1.5 flex-wrap">
                          <span x-show="msg.shipping_free" class="px-2 py-0.5 rounded-[4px] bg-[#111111] border border-[#262626] text-[10px] font-medium text-[#fafafa]">Frete grátis</span>
                          <span x-show="msg.discount_percent > 0" class="px-2 py-0.5 rounded-[4px] bg-[#111111] border border-[#262626] text-[10px] font-medium text-[#22c55e]" x-text="msg.discount_percent + '% OFF'"></span>
                          <span x-show="msg.payment_method === 'pix'" class="px-2 py-0.5 rounded-[4px] bg-[#111111] border border-[#262626] text-[10px] font-medium text-[#fafafa]">Pix</span>
                          <span x-show="msg.installments_n > 0" class="px-2 py-0.5 rounded-[4px] bg-[#111111] border border-[#262626] text-[10px] font-medium text-[#fafafa]" x-text="msg.installments_n + 'x sem juros'"></span>
                          <span x-show="msg.is_recurring" class="px-2 py-0.5 rounded-[4px] bg-[#111111] border border-[#262626] text-[10px] font-medium text-[#fafafa]">Recorrente</span>
                        </div>
                        <span x-show="msg.merchant" class="text-[10px] font-bold text-[#737373] uppercase ml-2 flex-shrink-0" x-text="msg.merchant"></span>
                      </div>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </div>
        </div>
      </main>

      <!-- Right Detail Panel -->
      <aside x-data="detailPanel" x-show="isOpen" style="display: none;" class="w-80 border-l border-[#262626] bg-[#111111] flex flex-col flex-shrink-0">
        <div class="p-4 border-b border-[#262626] flex justify-between items-center">
          <h2 class="text-xs font-bold uppercase tracking-widest text-[#737373]">Inspeção Detalhada</h2>
          <button @click="close()" aria-label="Fechar painel de detalhes" class="text-[#737373] hover:text-[#fafafa]">
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        </div>
        
        <div class="flex-1 overflow-y-auto p-4 space-y-6">
          <template x-if="detailMessage && detailType === 'processed'">
            <div>
              <!-- Thumbnail -->
              <div x-show="detailMessage.photo_id > 0" class="w-full h-48 bg-[#1a1a1a] rounded-[4px] mb-4 overflow-hidden border border-[#262626]">
                <img :src="getMediaUrl(detailMessage.id)" @error="$event.target.style.display='none'" class="w-full h-full object-cover" />
              </div>

              <section class="mb-6">
                <div class="text-[10px] text-[#737373] uppercase font-bold mb-3">Conteúdo Limpo</div>
                <div class="bg-[#0a0a0a] border border-[#262626] p-3 rounded-[4px] font-mono text-[11px] leading-relaxed text-[#fafafa] whitespace-pre-wrap" x-text="detailMessage.text_clean"></div>
              </section>

              <section class="grid grid-cols-2 gap-4 mb-6">
                <div>
                  <div class="text-[10px] text-[#737373] uppercase font-bold mb-1">Cupom</div>
                  <div x-show="!detailMessage.coupon_code" class="text-xs text-[#737373]">Nenhum</div>
                  <div x-show="detailMessage.coupon_code" class="flex items-center gap-2">
                    <div class="flex-1 bg-[#1a1a1a] border border-[#262626] py-1 px-2 rounded font-mono text-xs text-[#fafafa] truncate" x-text="detailMessage.coupon_code"></div>
                    <button @click="copyCoupon()" class="p-1.5 bg-[#6366f1] rounded hover:bg-[#4f46e5]">
                      <i data-lucide="copy" class="w-3 h-3 text-white"></i>
                    </button>
                  </div>
                </div>
                <div>
                  <div class="text-[10px] text-[#737373] uppercase font-bold mb-1">Parcerias</div>
                  <div x-show="!detailMessage.url" class="text-xs text-[#737373]">Nenhum link</div>
                  <div x-show="detailMessage.url" class="bg-[#1a1a1a] border border-[#262626] py-1 px-2 rounded text-xs text-[#fafafa] truncate" :title="detailMessage.url" x-text="detailMessage.url"></div>
                </div>
              </section>

              <section class="space-y-3 mb-6">
                <div class="text-[10px] text-[#737373] uppercase font-bold">Metadados do Sistema</div>
                <div class="space-y-2">
                  <div class="flex justify-between items-center text-[11px] pb-1 border-b border-[#262626]">
                    <span class="text-[#737373]">ID Interno</span>
                    <span class="font-mono" x-text="'#' + detailMessage.id"></span>
                  </div>
                  <div class="flex justify-between items-center text-[11px] pb-1 border-b border-[#262626]">
                    <span class="text-[#737373]">Raw Msg ID</span>
                    <span class="font-mono" x-text="detailMessage.raw_message_id"></span>
                  </div>
                  <div class="flex justify-between items-center text-[11px] pb-1 border-b border-[#262626]">
                    <span class="text-[#737373]">Channel ID</span>
                    <span class="font-mono" x-text="detailMessage.channel_id"></span>
                  </div>
                  <div class="flex justify-between items-center text-[11px] pb-1 border-b border-[#262626]">
                    <span class="text-[#737373]">Duplicada</span>
                    <span :class="detailMessage.is_duplicate ? 'text-[#ef4444]' : 'text-[#22c55e]'" x-text="detailMessage.is_duplicate ? 'Sim' : 'Não'"></span>
                  </div>
                  <div class="flex justify-between items-center text-[11px] pb-1 border-b border-[#262626]">
                    <span class="text-[#737373]">Processado Em</span>
                    <span class="font-mono" x-text="formatDate(detailMessage.processed_at)"></span>
                  </div>
                </div>
              </section>

              <a x-show="detailMessage.url" :href="detailMessage.url" target="_blank" rel="noopener" class="block w-full text-center py-2 bg-[#fafafa] text-[#0a0a0a] rounded-[6px] text-xs font-bold uppercase tracking-widest hover:bg-[#e5e5e5] transition-colors">
                Abrir Link Original
              </a>
            </div>
          </template>
          
          <template x-if="detailMessage && detailType === 'raw'">
             <div>
                <section class="space-y-3 mb-6">
                  <div class="text-[10px] text-[#737373] uppercase font-bold">Metadados Raw</div>
                  <div class="space-y-2">
                    <div class="flex justify-between items-center text-[11px] pb-1 border-b border-[#262626]">
                      <span class="text-[#737373]">ID Interno</span>
                      <span class="font-mono" x-text="'#' + detailMessage.ID"></span>
                    </div>
                    <div class="flex justify-between items-center text-[11px] pb-1 border-b border-[#262626]">
                      <span class="text-[#737373]">Message ID</span>
                      <span class="font-mono" x-text="detailMessage.MessageID"></span>
                    </div>
                    <div class="flex justify-between items-center text-[11px] pb-1 border-b border-[#262626]">
                      <span class="text-[#737373]">Channel ID</span>
                      <span class="font-mono" x-text="detailMessage.ChannelID"></span>
                    </div>
                    <div class="flex justify-between items-center text-[11px] pb-1 border-b border-[#262626]">
                      <span class="text-[#737373]">Schema Version</span>
                      <span class="font-mono" x-text="detailMessage.SchemaVersion"></span>
                    </div>
                    <div class="flex justify-between items-center text-[11px] pb-1 border-b border-[#262626]">
                      <span class="text-[#737373]">Recebido Em</span>
                      <span class="font-mono" x-text="formatDate(detailMessage.ReceivedAt)"></span>
                    </div>
                  </div>
                </section>
                
                <section class="mb-6">
                  <div class="text-[10px] text-[#737373] uppercase font-bold mb-3">JSON Payload</div>
                  <div class="bg-[#0a0a0a] border border-[#262626] p-3 rounded-[4px] overflow-x-auto">
                     <pre class="font-mono text-[10px] leading-relaxed text-[#d4d4d4]" x-text="rawPayload"></pre>
                  </div>
                </section>
             </div>
          </template>

          <div x-show="!detailMessage" class="flex flex-col items-center justify-center py-12 text-[#737373]">
             <i data-lucide="mouse-pointer-click" class="w-8 h-8 mb-3 opacity-50"></i>
             <p class="text-xs text-center px-4">Selecione um item na lista para ver os detalhes.</p>
          </div>
        </div>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
