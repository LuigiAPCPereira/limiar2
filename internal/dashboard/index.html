<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Limiar Dashboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; }
  header { background: #1e293b; padding: 1.5rem 2rem; border-bottom: 1px solid #334155; }
  header h1 { font-size: 1.5rem; font-weight: 600; }
  header h1 span { color: #38bdf8; }
  .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
  .stat-card { background: #1e293b; border-radius: 0.5rem; padding: 1.25rem; border: 1px solid #334155; }
  .stat-card .label { font-size: 0.75rem; text-transform: uppercase; color: #94a3b8; letter-spacing: 0.05em; }
  .stat-card .value { font-size: 1.75rem; font-weight: 700; margin-top: 0.25rem; }
  .channels { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
  .channel-card { background: #1e293b; border-radius: 0.5rem; padding: 1rem; border: 1px solid #334155; cursor: pointer; transition: border-color 0.2s; }
  .channel-card:hover, .channel-card.active, .channel-card:focus-visible { border-color: #38bdf8; outline: 1px solid #38bdf8; outline-offset: -1px; }
  .channel-card .username { font-weight: 600; color: #38bdf8; }
  .channel-card .count { font-size: 0.875rem; color: #94a3b8; margin-top: 0.25rem; }
  .messages { background: #1e293b; border-radius: 0.5rem; border: 1px solid #334155; }
  .messages h2 { padding: 1rem; border-bottom: 1px solid #334155; font-size: 1rem; }
  .msg-list { max-height: 600px; overflow-y: auto; }
  .msg-item { padding: 0.75rem 1rem; border-bottom: 1px solid #1e293b; cursor: pointer; transition: background 0.15s; }
  .msg-item:hover, .msg-item:focus-visible { background: #334155; outline: 1px solid #38bdf8; outline-offset: -1px; }
  .msg-item .meta { font-size: 0.75rem; color: #94a3b8; }
  .msg-item .preview { font-size: 0.875rem; margin-top: 0.25rem; color: #cbd5e1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .msg-detail { position: fixed; top: 0; right: 0; width: 500px; height: 100vh; background: #1e293b; border-left: 1px solid #334155; padding: 1.5rem; overflow-y: auto; z-index: 10; }
  .msg-detail .close { position: absolute; top: 1rem; right: 1rem; background: none; border: none; color: #94a3b8; font-size: 1.5rem; cursor: pointer; }
  .msg-detail .close:hover, .msg-detail .close:focus-visible { color: #e2e8f0; outline: 1px solid #38bdf8; border-radius: 0.25rem; }
  .msg-detail h3 { margin-bottom: 1rem; }
  .msg-detail pre { background: #0f172a; padding: 1rem; border-radius: 0.25rem; font-size: 0.75rem; overflow-x: auto; white-space: pre-wrap; word-break: break-all; }
  .empty { text-align: center; padding: 3rem; color: #64748b; }
</style>
</head>
<body>
<header>
  <h1>◆ <span>Limiar</span> Dashboard</h1>
</header>
<div class="container">
  <div class="stats" id="stats"></div>
  <div class="channels" id="channels"></div>
  <div class="messages">
    <h2 id="msg-title">Mensagens recentes</h2>
    <div class="msg-list" id="msg-list" role="log" aria-live="polite" aria-label="Lista de mensagens">
      <div class="empty">Carregando...</div>
    </div>
  </div>
</div>
<div class="msg-detail" id="msg-detail" style="display:none">
  <button class="close" aria-label="Fechar painel de detalhes" onclick="closeDetail()">&times;</button>
  <h3>Detalhes da mensagem</h3>
  <pre id="msg-json"></pre>
</div>
<script>
let selectedChannel = 0;

function decodePayload(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return JSON.parse(new TextDecoder().decode(bytes));
}

function extractText(p) {
  // History backfill: {Message: "text", ...}
  if (p.Message && typeof p.Message === 'string') return p.Message;
  // Live capture: {Updates: [{Message: {Message: "text"}}]}
  if (p.Updates && p.Updates[0] && p.Updates[0].Message) {
    const m = p.Updates[0].Message;
    if (typeof m === 'string') return m;
    if (m.Message && typeof m.Message === 'string') return m.Message;
    if (m.Text) return typeof m.Text === 'string' ? m.Text : JSON.stringify(m.Text);
  }
  return null;
}

async function loadStats() {
  const res = await fetch('/api/channels');
  const data = await res.json();
  const total = data.reduce((s, c) => s + c.MessageCount, 0);
  document.getElementById('stats').innerHTML =
    '<div class="stat-card"><div class="label">Canais</div><div class="value">' + data.length + '</div></div>' +
    '<div class="stat-card"><div class="label">Total de mensagens</div><div class="value">' + total + '</div></div>';

  document.getElementById('channels').innerHTML = data.map(c =>
    '<div class="channel-card' + (c.ChannelID === selectedChannel ? ' active' : '') + '" onclick="selectChannel(' + c.ChannelID + ')" role="button" tabindex="0" aria-pressed="' + (c.ChannelID === selectedChannel) + '" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();selectChannel(' + c.ChannelID + ');}">' +
    '<div class="username">@' + escapeHtml(c.Username) + '</div>' +
    '<div class="count">' + c.MessageCount + ' mensagens</div></div>'
  ).join('');
}

async function loadMessages() {
  const url = '/api/messages?limit=50' + (selectedChannel ? '&channel_id=' + selectedChannel : '');
  const res = await fetch(url);
  const data = await res.json();
  const title = selectedChannel ? 'Mensagens do canal' : 'Mensagens recentes';
  document.getElementById('msg-title').textContent = title + ' (' + data.length + ')';

  if (data.length === 0) {
    document.getElementById('msg-list').innerHTML = '<div class="empty">Nenhuma mensagem encontrada</div>';
    return;
  }

  document.getElementById('msg-list').innerHTML = data.map(m => {
    let preview = '';
    try {
      const p = decodePayload(m.Payload);
      preview = extractText(p) || JSON.stringify(p).substring(0, 150);
    } catch(e) { preview = '(erro ao decodificar: ' + e.message + ')'; }
    return '<div class="msg-item" onclick="showDetail(' + m.ID + ')" role="button" tabindex="0" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();showDetail(' + m.ID + ');}">' +
      '<div class="meta">ID: ' + m.MessageID + ' | Canal: ' + m.ChannelID + ' | ' + new Date(m.ReceivedAt).toLocaleString('pt-BR') + '</div>' +
      '<div class="preview">' + escapeHtml(preview) + '</div></div>';
  }).join('');
}

async function showDetail(id) {
  const res = await fetch('/api/message/' + id);
  const data = await res.json();
  let payload;
  try { payload = decodePayload(data.Payload); }
  catch { payload = data.Payload; }
  document.getElementById('msg-json').textContent = JSON.stringify(payload, null, 2);
  document.getElementById('msg-detail').style.display = 'block';
}

function closeDetail() {
  document.getElementById('msg-detail').style.display = 'none';
}

function selectChannel(id) {
  selectedChannel = selectedChannel === id ? 0 : id;
  loadStats();
  loadMessages();
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

loadStats();
loadMessages();

let pollingInterval = null;
function startPolling() {
  if (pollingInterval) return;
  pollingInterval = setInterval(function() {
    loadStats();
    loadMessages();
  }, 30000);
}

if (window.EventSource) {
  const es = new EventSource('/api/events');
  es.addEventListener('message', function() {
    loadMessages();
    loadStats();
  });
  es.addEventListener('stats', function() {
    loadStats();
  });
  es.onerror = function() {
    // Fallback to polling if SSE fails
    startPolling();
  };
} else {
  startPolling();
}
</script>
</body>
</html>
