name: EXP-LIMIAR-004 — Evidence physical envelope

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - "experiments/evidence-envelope/**"
      - "docs/evolution/experiments/EXP-LIMIAR-004-evidence-physical-envelope.md"
      - ".github/workflows/exp-evidence-envelope.yml"

permissions:
  contents: read

jobs:
  evidence-envelope-contract:
    name: Evidence envelope contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/evidence-envelope

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version: "1.26.2"
          check-latest: false
          cache: false

      - name: Resolve pinned dependencies
        run: |
          go mod tidy
          git diff --exit-code -- go.mod
          cat go.sum

      - name: Vet
        run: go vet ./...

      - name: Test without CGO
        env:
          CGO_ENABLED: "0"
        run: go test ./... -count=1 -v

      - name: Test with race detector
        run: go test -race ./... -count=1
