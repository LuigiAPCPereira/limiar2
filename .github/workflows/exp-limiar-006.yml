name: EXP-LIMIAR-006

on:
  pull_request:
    branches:
      - "main"
      - "exp/limiar-005-append-only-evidence"
    paths:
      - "experiments/evidence-envelope/**"
      - "docs/evolution/experiments/EXP-LIMIAR-006-side-by-side-legacy-import.md"
      - ".github/workflows/exp-limiar-006.yml"

jobs:
  side-by-side-legacy-import:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/evidence-envelope
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.2'
          check-latest: true

      - name: Verify module
        run: go mod verify

      - name: Gofmt
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test without CGO
        env:
          CGO_ENABLED: 0
        run: go test ./... -count=1 -v

      - name: Race detector
        run: go test -race ./... -count=1
