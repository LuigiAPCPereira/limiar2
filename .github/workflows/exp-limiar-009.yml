name: EXP-LIMIAR-009

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - "internal/telegram/gotd_physical_ordering_exp_test.go"
      - "internal/telegram/gotd_recovery_contract_test.go"
      - "docs/evolution/experiments/EXP-LIMIAR-009-manager-physical-ordering.md"
      - ".github/workflows/exp-limiar-009.yml"

jobs:
  manager-physical-ordering:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.26.2'
          check-latest: true

      - name: Verify module
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: EXP-LIMIAR-009 without CGO
        env:
          CGO_ENABLED: 0
        run: go test ./internal/telegram -run '^TestEXP009_' -count=1 -v

      - name: Full tests without CGO
        env:
          CGO_ENABLED: 0
        run: go test ./... -count=1

      - name: Race detector
        run: go test -race ./... -count=1
