name: CI do Limiar 3

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  verify:
    name: Verificar Limiar 3 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Fazer checkout do código
        uses: actions/checkout@v7

      - name: Configurar Go 1.27.1
        uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.1"
          check-latest: false
          cache: true

      - name: Exibir toolchain
        run: go version

      - name: Verificar módulo
        run: go mod verify

      - name: Verificar contenção do legado
        if: runner.os == 'Linux'
        run: bash scripts/ci/check-no-legacy-imports.sh

      - name: Compilar
        run: go build ./...

      - name: Executar vet
        run: go vet ./...

      - name: Executar testes
        run: go test -count=1 ./...

      - name: Executar race detector
        if: runner.os == 'Linux'
        run: go test -race -count=1 ./...

      - name: Instalar govulncheck
        if: runner.os == 'Linux'
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Verificar vulnerabilidades
        if: runner.os == 'Linux'
        run: govulncheck ./...
