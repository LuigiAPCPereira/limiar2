name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build, Test & Lint
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v6.5.0
      with:
        go-version: 'stable'
        check-latest: true

    - name: Verify Dependencies
      run: go mod verify

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v9.2.1
      with:
        version: latest
        args: --timeout=5m

    - name: Run Gosec Security Scanner
      uses: securego/gosec@v2.29.0
      with:
        args: -exclude-dir=.agents ./...

    - name: Run go vet
      run: go vet ./...

    - name: Enforce Accepted Storage Dependency Boundaries
      run: bash scripts/ci/check-storage-dependencies.sh

    - name: Build
      run: go build -v ./...

    - name: Test (with Race Detector & Coverage)
      run: go test -v -race -coverprofile=coverage.out -count=1 ./...

    - name: Code Coverage Summary
      run: go tool cover -func=coverage.out
