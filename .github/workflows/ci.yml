name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build, Test & Lint
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v6.5.0
      with:
        go-version: 'stable'
        check-latest: true

    - name: Verify Dependencies
      run: go mod verify

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v9.2.1
      with:
        version: latest
        args: --timeout=5m

    - name: Run Gosec Security Scanner
      uses: securego/gosec@v2.29.0
      with:
        args: -exclude-dir=.agents ./...

    - name: Run go vet
      run: go vet ./...

    - name: Enforce Accepted Storage Dependency Boundaries
      run: |
        echo "Validando boundaries de dependências de storage conforme ADR 019..."

        # ADR 019 aceita github.com/ncruces/go-sqlite3 para o novo storage e permite
        # que Tursogo permaneça no caminho legado/importação enquanto necessário.
        # ORMs e drivers SQLite estruturais alternativos abaixo não fazem parte da
        # baseline aceita e não devem entrar como dependências diretas por acidente.
        FORBIDDEN_DIRECT_DEPS=("github.com/mattn/go-sqlite3" "modernc.org/sqlite" "gorm.io/gorm")

        # Inspeciona o go.mod diretamente e ignora ocorrências transitivas marcadas
        # como indirect. Este gate não tenta provar o escopo de uso do Tursogo; ele
        # apenas evita introduzir dependências estruturais fora do baseline aceito.
        for pkg in "${FORBIDDEN_DIRECT_DEPS[@]}"; do
          if grep "$pkg" go.mod | grep -qv "// indirect"; then
            echo "::error::Dependência estrutural não autorizada detectada: $pkg. Consulte ADR 019 antes de alterar o baseline de storage."
            exit 1
          fi
        done
        echo "Validação de boundaries de storage concluída com sucesso."

    - name: Test SQLite Storage without CGO
      env:
        CGO_ENABLED: "0"
      run: go test -count=1 ./internal/storage/sqlite/...

    - name: Build
      run: go build -v ./...

    - name: Test (with Race Detector & Coverage)
      run: go test -v -race -coverprofile=coverage.out -count=1 ./...

    - name: Code Coverage Summary
      run: go tool cover -func=coverage.out
