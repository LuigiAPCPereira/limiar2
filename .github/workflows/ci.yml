name: Limiar 3 CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    name: Verify Limiar 3 root
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go 1.27.1
        uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.1"
          check-latest: false
          cache: true

      - name: Show toolchain
        run: go version

      - name: Verify module
        run: go mod verify

      - name: Enforce legacy containment
        run: bash scripts/ci/check-no-legacy-imports.sh

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Race
        run: go test -race -count=1 ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Vulnerability scan
        run: govulncheck ./...
